name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, ext: "" }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, ext: "" }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: "" }
          - { os: macos-15-intel, target: x86_64-apple-darwin, ext: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: ".exe" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --manifest-path cli/Cargo.toml --target ${{ matrix.target }}
      - run: cargo build --release --no-default-features --bin omni2api --manifest-path server/Cargo.toml --target ${{ matrix.target }}
      - shell: bash
        run: |
          mkdir dist
          cp cli/target/${{ matrix.target }}/release/oh-seat${{ matrix.ext }} dist/oh-seat-${{ matrix.target }}${{ matrix.ext }}
          cp server/target/${{ matrix.target }}/release/omni2api${{ matrix.ext }} dist/omni2api-${{ matrix.target }}${{ matrix.ext }}
      - uses: actions/upload-artifact@v4
        with: { name: "bins-${{ matrix.target }}", path: dist/* }
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: "dist/*" }
